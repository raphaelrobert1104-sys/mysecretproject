name: Publish Tampermonkey userscript

on:
  push:
    branches:
      - main
    paths:
      - outputs/projet-secret.user.js
      - .github/workflows/publish-userscript.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Read userscript version
        id: metadata
        shell: bash
        run: |
          version="$(sed -nE 's#^// @version[[:space:]]+([^[:space:]]+).*#\1#p' outputs/projet-secret.user.js | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish latest release with userscript asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.metadata.outputs.version }}
          name: Projet secret v${{ steps.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: outputs/projet-secret.user.js
          make_latest: true
          fail_on_unmatched_files: true
